<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}FC Barcelona{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  {% block extra_css %}{% endblock %}
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="{% url 'index' %}" class="nav-logo">
      <div class="crest"></div>
      FCB <span style="color:var(--barca-gold)">2026</span>
    </a>
    <ul class="nav-links">
      <li><a href="{% url 'index' %}" {% if request.resolver_match.url_name == 'index' %}class="active"{% endif %}>Início</a></li>
      <li><a href="{% url 'elenco' %}" {% if request.resolver_match.url_name == 'elenco' %}class="active"{% endif %}>Elenco</a></li>
      <li><a href="{% url 'sobre' %}" {% if request.resolver_match.url_name == 'sobre' %}class="active"{% endif %}>Sobre</a></li>
    </ul>
  </div>
</nav>

<main>
  {% block content %}{% endblock %}
</main>

<footer>
  <p>Feito com <span>♥</span> por Messias &mdash; Aluno de Informática &bull; FC Barcelona &copy; 2026</p>
</footer>

{% block extra_js %}{% endblock %}
</body>
</html>
